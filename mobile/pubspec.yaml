name: wheeldeck
description: A mobile app that turns a phone into a steering wheel and dashboard panel for PC simulators.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  stream_channel: ^2.1.4
  multicast_dns: ^0.3.3+1
  shared_preferences: ^2.5.5
  permission_handler: ^11.3.1
  provider: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
