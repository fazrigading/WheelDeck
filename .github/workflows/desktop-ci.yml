name: Desktop CI

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: .NET build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore desktop/WheelDeck.sln

      - name: Build
        run: dotnet build desktop/WheelDeck.sln --no-restore

      - name: Test
        run: dotnet test desktop/WheelDeck.sln --no-build --verbosity normal
