name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Same JDK as android-ci.yml: Gradle runs on 21, the toolchain targets 17.
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v5
        with:
          name: wheeldeck-android
          path: android/app/build/outputs/apk/release/app-release.apk

  desktop-windows:
    name: .NET publish (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish
        run: >
          dotnet publish desktop/WheelDeck.App/WheelDeck.App.csproj
          -c Release -r win-x64 --self-contained -o publish/windows

      - name: Zip
        run: Compress-Archive -Path publish/windows/* -DestinationPath wheeldeck-windows-x64.zip

      - uses: actions/upload-artifact@v5
        with:
          name: wheeldeck-windows
          path: wheeldeck-windows-x64.zip

  desktop-linux:
    name: .NET publish (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish
        run: >
          dotnet publish desktop/WheelDeck.App/WheelDeck.App.csproj
          -c Release -r linux-x64 --self-contained -o publish/linux

      - name: Tar
        run: tar -czf wheeldeck-linux-x64.tar.gz -C publish/linux .

      - uses: actions/upload-artifact@v5
        with:
          name: wheeldeck-linux
          path: wheeldeck-linux-x64.tar.gz

  release:
    name: Create GitHub Release
    needs: [android, desktop-windows, desktop-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Rename
        run: |
          mv artifacts/wheeldeck-android/app-release.apk artifacts/wheeldeck-android-${{ github.ref_name }}.apk
          mv artifacts/wheeldeck-windows/wheeldeck-windows-x64.zip artifacts/wheeldeck-windows-x64-${{ github.ref_name }}.zip
          mv artifacts/wheeldeck-linux/wheeldeck-linux-x64.tar.gz artifacts/wheeldeck-linux-x64-${{ github.ref_name }}.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
          files: |
            artifacts/wheeldeck-android-${{ github.ref_name }}.apk
            artifacts/wheeldeck-windows-x64-${{ github.ref_name }}.zip
            artifacts/wheeldeck-linux-x64-${{ github.ref_name }}.tar.gz
